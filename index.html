<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工资计算器</title>
<style>
  :root{
    --bg:#f5f5f4; --card:#ffffff; --border:#e4e4e2; --text:#1a1a18;
    --text-secondary:#6b6b66; --text-muted:#9a9a94; --accent:#185fa5;
    --success:#27500a; --danger:#791f1f; --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:24px 16px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-size:20px;font-weight:500;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--text-muted);margin:0 0 24px;}
  label{font-size:14px;color:var(--text-secondary);display:block;margin-bottom:4px;}
  select,input{
    width:100%;height:40px;border:1px solid var(--border);border-radius:var(--radius);
    padding:0 12px;font-size:15px;background:#fff;color:var(--text);margin-bottom:14px;
  }
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(24,95,165,0.15);}
  button{
    width:100%;height:44px;border:1px solid var(--border);border-radius:var(--radius);
    background:#fff;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:20px;
  }
  button:hover{background:#f0f0ee;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:24px;display:none;
  }
  table{width:100%;font-size:13px;border-collapse:collapse;}
  td{padding:5px 0;}
  td:last-child{text-align:right;}
  .row1{color:var(--text-secondary);}
  .divider{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;
    display:flex;justify-content:space-between;align-items:baseline;}
  .total{font-size:22px;font-weight:600;}
  .roleinfo{font-size:13px;color:var(--text-muted);margin:-8px 0 16px;}
  .err{font-size:13px;color:var(--danger);display:none;margin:-8px 0 14px;}
  .section-title{font-size:15px;font-weight:500;margin:32px 0 12px;padding-top:20px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">
  <h1>工资计算器</h1>
  <p class="sub">选择员工,输入当月数据,自动计算工资</p>

  <label for="emp">选择员工</label>
  <select id="emp"></select>
  <p id="empRole" class="roleinfo"></p>

  <label for="sales">当月区域销售额(元)</label>
  <input type="number" id="sales" placeholder="例如 300000">

  <label for="huikuan">当月回款/实收金额(元)</label>
  <input type="number" id="huikuan" placeholder="例如 280000">

  <label for="leave">当月请假天数</label>
  <input type="number" id="leave" placeholder="0" value="0">

  <p id="err1" class="err"></p>
  <button id="calcBtn">计算当月工资</button>

  <div id="result" class="card">
    <table id="resTable"></table>
    <div class="divider">
      <span style="font-size:14px;color:var(--text-secondary)">当月应发工资</span>
      <span class="total" id="totalOut"></span>
    </div>
  </div>

  <div class="section-title">季度核算(每季度末使用)</div>

  <label for="qTotal">近三个月合计销售额(元)</label>
  <input type="number" id="qTotal" placeholder="用于判断是否超额完成任务">

  <label for="qHuikuan">近三个月合计回款(元)</label>
  <input type="number" id="qHuikuan" placeholder="未达标时用于计算提成">

  <label for="qPaid">前三个月已发放提成合计(元)</label>
  <input type="number" id="qPaid" placeholder="用于计算未达标时应扣/应补的差额">

  <p id="err2" class="err"></p>
  <button id="qBtn">计算季度奖惩</button>

  <div id="qResult" class="card"></div>
</div>

<script>
const employees = {
  "李文廷": {role:"客服", target:263215.3508, base:5000},
  "刘盼": {role:"客服", target:290928.6542, base:5000},
  "孙惠娟": {role:"客服", target:214650.2758, base:3800},
  "张鲁彬": {role:"业务", target:768794.25, base:5000},
  "赵兵": {role:"仓库", target:768794.25, base:5000},
  "吴鑫玲": {role:"业务", target:768794.25, base:5000}
};
const rules = {
  "客服": {met:0.005, unmet:0.005, qExcess:0.0025},
  "业务": {met:0.0025, unmet:0.0025, qExcess:0.00125},
  "仓库": {monthRate:0.001, qExcess:0.001}
};
const roleLabel = {
  "客服":"客服岗(提成按当月回款计)",
  "业务":"业务岗(提成按当月回款计)",
  "仓库":"仓库岗(提成按当月销售额计)"
};

const empSel = document.getElementById('emp');
Object.keys(employees).forEach(function(n){
  const o = document.createElement('option');
  o.value = n; o.textContent = n;
  empSel.appendChild(o);
});

function updateRole(){
  const e = employees[empSel.value];
  document.getElementById('empRole').textContent =
    roleLabel[e.role] + '   月任务基数: ' + e.target.toLocaleString('zh-CN',{maximumFractionDigits:0}) + ' 元';
}
empSel.addEventListener('change', updateRole);
updateRole();

function fmt(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

document.getElementById('calcBtn').addEventListener('click', function(){
  const errEl = document.getElementById('err1');
  const name = empSel.value;
  const emp = employees[name];
  const rule = rules[emp.role];
  const sales = parseFloat(document.getElementById('sales').value);
  const huikuan = parseFloat(document.getElementById('huikuan').value);
  const leave = parseFloat(document.getElementById('leave').value);
  const needSales = emp.role === '仓库';

  if((isNaN(sales) || sales < 0) ||
     (!needSales && (isNaN(huikuan) || huikuan < 0)) ||
     isNaN(leave) || leave < 0 || leave > 30){
    errEl.textContent = '请填写完整且非负的数值';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const insurance = 471;
  const leaveDeduction = emp.base / 30 * leave;
  const fullBonus = leave === 0 ? 100 : 0;
  let commission, completionRate;
  const rows = [];

  if(emp.role === '仓库'){
    commission = sales * rule.monthRate;
    rows.push(['区域销售额', fmt(sales)]);
    rows.push(['提成(销售额×1.0‰)', fmt(commission)]);
  } else {
    completionRate = sales / emp.target;
    rows.push(['区域销售额', fmt(sales) + '(完成率 ' + Math.round(completionRate*100) + '%,' + (completionRate>=1?'达标':'未达标') + ')']);
    if(completionRate >= 1){
      commission = huikuan * rule.met;
      rows.push(['当月回款', fmt(huikuan)]);
      rows.push(['提成(回款×' + (rule.met*1000).toFixed(1) + '‰)', fmt(commission)]);
    } else {
      commission = huikuan * completionRate * rule.unmet;
      rows.push(['当月回款', fmt(huikuan)]);
      rows.push(['提成(回款×完成率×' + rule.unmet + ')', fmt(commission)]);
    }
  }

  rows.push(['基本工资', fmt(emp.base)]);
  rows.push(['五险扣除', '-' + fmt(insurance)]);
  rows.push(['请假扣款(' + leave + '天)', leave > 0 ? '-' + fmt(leaveDeduction) : '0']);
  rows.push(['全勤奖', fullBonus > 0 ? '+' + fullBonus : '0']);

  const total = emp.base - insurance - leaveDeduction + fullBonus + commission;

  const table = document.getElementById('resTable');
  table.innerHTML = rows.map(function(r){
    return '<tr><td class="row1">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  }).join('');
  document.getElementById('totalOut').textContent = '¥' + fmt(total);
  document.getElementById('result').style.display = 'block';
});

document.getElementById('qBtn').addEventListener('click', function(){
  const errEl = document.getElementById('err2');
  const name = empSel.value;
  const emp = employees[name];
  const rule = rules[emp.role];
  const qTotal = parseFloat(document.getElementById('qTotal').value);
  const qHuikuan = parseFloat(document.getElementById('qHuikuan').value);
  const qPaid = parseFloat(document.getElementById('qPaid').value);

  if(isNaN(qTotal) || qTotal < 0){
    errEl.textContent = '请填写三个月合计销售额';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const target3 = emp.target * 3;
  const box = document.getElementById('qResult');
  let html = '';

  if(qTotal >= target3){
    if(emp.role === '仓库'){
      const excess = qTotal - target3;
      const bonus = excess * rule.qExcess;
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px">季度任务: ' + fmt(target3) + ' 元,已超额 ' + fmt(excess) + ' 元</p>';
      html += '<div class="divider" style="border-top:none;margin-top:0;padding-top:0"><span style="font-size:14px;color:var(--text-secondary)">超额奖金</span><span class="total" style="color:var(--success)">+¥' + fmt(bonus) + '</span></div>';
    } else {
      if(isNaN(qHuikuan) || qHuikuan < 0){
        errEl.textContent = '已超额,请填写三个月合计回款以计算超额奖金';
        errEl.style.display = 'block';
        return;
      }
      const excess = Math.max(0, qHuikuan - target3);
      const bonus = excess * rule.qExcess;
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px">季度任务(按销售额): ' + fmt(target3) + ' 元,销售额已超额</p>';
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">三个月合计回款 ' + fmt(qHuikuan) + ' 元,超出部分 ' + fmt(excess) + ' 元</p>';
      html += '<div class="divider" style="border-top:none;margin-top:0;padding-top:0"><span style="font-size:14px;color:var(--text-secondary)">超额奖金</span><span class="total" style="color:var(--success)">+¥' + fmt(bonus) + '</span></div>';
    }
  } else {
    const rate3 = qTotal / target3;
    if(emp.role === '仓库'){
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0">仓库岗未超额,无季度调整。</p>';
    } else {
      if(isNaN(qHuikuan) || qHuikuan < 0){
        errEl.textContent = '未达标时,请填写三个月合计回款以计算提成';
        errEl.style.display = 'block';
        return;
      }
      if(isNaN(qPaid)){
        errEl.textContent = '未达标时,请填写前三个月已发放提成合计以计算差额';
        errEl.style.display = 'block';
        return;
      }
      const shouldPay = qHuikuan * rate3 * rule.unmet;
      const diff = qPaid - shouldPay;
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px">季度任务(按销售额): ' + fmt(target3) + ' 元,完成率 ' + Math.round(rate3*100) + '%</p>';
      html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 10px">应发提成合计(按回款): ' + fmt(shouldPay) + ' 元 / 已发放: ' + fmt(qPaid) + ' 元</p>';
      if(diff > 0){
        html += '<div class="divider" style="border-top:none;margin-top:0;padding-top:0"><span style="font-size:14px;color:var(--text-secondary)">需扣回金额</span><span class="total" style="color:var(--danger)">-¥' + fmt(diff) + '</span></div>';
      } else {
        html += '<div class="divider" style="border-top:none;margin-top:0;padding-top:0"><span style="font-size:14px;color:var(--text-secondary)">需补发金额</span><span class="total" style="color:var(--success)">+¥' + fmt(Math.abs(diff)) + '</span></div>';
      }
    }
  }

  box.innerHTML = html;
  box.style.display = 'block';
});
</script>
<style>
.wrap{max-width:760px}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;margin:20px 0}.panel h2{font-size:18px;margin:0 0 12px}.hint{font-size:13px;color:#62625c;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.primary{background:#185fa5;color:white}.primary:hover{background:#124c87}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;min-height:140px;border:1px solid var(--border);border-radius:8px;padding:12px;font:14px sans-serif;margin-bottom:12px}input[type=file]{height:auto;padding:10px}#ledgerNotice,#importStatus,#saveStatus{white-space:pre-wrap;font-size:14px;line-height:1.6}#ledgerNotice{color:#791f1f}.scroll-table{overflow:auto}th,td{padding:10px 8px!important;text-align:left!important;border-bottom:1px solid #eee;white-space:nowrap}th{font-weight:500;background:#f5f5f4}.stat{font-size:20px;font-weight:600;color:#185fa5}details{margin:18px 0}summary{cursor:pointer;font-size:16px}.mini{width:auto;height:32px;margin:0;padding:0 12px}#previewImage{max-width:100%;max-height:300px;display:none}.badge{display:inline-block;background:#e9f2fc;color:#185fa5;border-radius:8px;padding:5px 9px;font-size:12px}.card{overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.panel{padding:14px}body{padding:18px 12px} .stat{font-size:18px}}
</style>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const round = n => Math.round((n+Number.EPSILON)*100)/100;
const key = 'my-salary-ledger-v1';
const escapeHTML = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canonicalName=n=>({'张鲁冰':'张鲁彬','吴欣玲':'吴鑫玲'}[n]||n);
function normalizeLedger(d){const fix=b=>{if(!b||typeof b!=='object'||Array.isArray(b))return;for(const n of Object.keys(b)){const c=canonicalName(n);if(c!==n){if(!Object.hasOwn(b,c))b[c]=b[n];delete b[n];}}};for(const list of [d.records,d.history])if(Array.isArray(list))list.forEach(r=>{if(!r||typeof r!=='object')return;r.employee=canonicalName(r.employee);fix(r.salesBreakdown);fix(r.receiptsBreakdown);});for(const maps of [d.salesByMonth,d.receiptsByMonth])if(maps&&typeof maps==='object')Object.values(maps).forEach(fix);return d;}
let blocked=false;
const top = document.createElement('section');top.className='panel';top.innerHTML=`
<span class="badge">本地工资账本 · 图片识别免费</span><h2 style="margin-top:14px">工资月份与导入</h2>
<label for="salaryMonth">工资所属月份</label><input id="salaryMonth" type="month">
<details><summary>导入图片或文字报表</summary>
<p class="hint">支持 Excel（.xlsx、.xls）、CSV、TXT，以及 JPG、PNG、WebP 图片。图片在当前设备识别，不上传报表。首次识别需要联网下载开源组件；识别结果必须核对。Excel 表格直接读取，不需要拍照；PDF 请先截取报表图片。</p>
<label for="sourceFile">选择 Excel、图片或文字文件</label><input id="sourceFile" type="file" accept="image/png,image/jpeg,image/webp,.txt,.csv,.xlsx,.xls">
<img id="previewImage" alt="待识别报表预览"><button id="recognizeBtn">识别／读取所选文件</button><p id="importStatus" role="status"></p>
<label for="ocrText">识别原文（也可直接粘贴报表文字）</label><textarea id="ocrText" placeholder="例如：2026年9月\n员工：李文廷\n销售额：300000\n回款金额：280000"></textarea>
<button id="parseBtn">从文字提取待核对数据</button><div id="proposal" hidden>
<p class="hint">只提取明确、唯一的字段。未找到或有多个金额时留空，请自行核对。营业额按销售额处理，不会替代回款。</p>
<label for="importEmployee">员工</label><select id="importEmployee"><option value="">不更改当前员工</option></select>
<label for="importMonth">月份</label><input id="importMonth" type="month">
<div class="grid"><div><label for="importSales">销售额／营业额（元）</label><input id="importSales" type="number" min="0" step="0.01"></div><div><label for="importReceipts">回款／实收（元）</label><input id="importReceipts" type="number" min="0" step="0.01"></div></div>
<label for="importLeave">请假天数</label><input id="importLeave" type="number" min="0" max="30" step="0.5">
<button id="applyImport" class="primary">已核对，填入计算器</button></div></details>`;
document.querySelector('.sub').after(top);
Object.keys(employees).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('importEmployee').append(o);});
$('salaryMonth').value=today().slice(0,7);
const saving=document.createElement('section');saving.className='panel';saving.innerHTML=`<h2>保存工资与发放记录</h2>
<div class="grid"><div><label for="actualPaid">实际已发金额（元）</label><input id="actualPaid" type="number" min="0" step="0.01" placeholder="未发放填 0" value="0"></div><div><label for="paidDate">最近发放日期</label><input id="paidDate" type="date"></div></div>
<label for="payNote">备注</label><input id="payNote" maxlength="500" placeholder="例如：已分两次发放、剩余下月补发">
<p class="hint">实际已发金额填写累计实付金额。同一员工同一月份再次保存会提示更新；修改前的记录会保留在备份文件的历史里。</p>
<button id="saveMonth" class="primary">计算并保存本月工资</button><button id="saveQuarter">保存本月的季度奖惩记录</button><p id="saveStatus" role="status"></p>`;
$('result').after(saving);
const ledger=document.createElement('section');ledger.className='panel';ledger.innerHTML=`<h2>年度工资账本</h2>
<p class="hint">记录保存在当前设备、当前浏览器中；换设备不会自动同步，清理网站数据会清除记录。请定期下载备份。年度汇总按工资所属月份统计，季度调整单独保存后计入应发总额。</p>
<p id="ledgerNotice" role="alert"></p><div class="grid"><div><label for="ledgerYear">年份</label><input id="ledgerYear" type="number" min="1900" max="2200"></div><div><label for="ledgerEmployee">员工筛选</label><select id="ledgerEmployee"><option value="">全部员工</option></select></div></div>
<p id="annualTotals" class="stat"></p><div class="scroll-table"><table><thead><tr><th>员工</th><th>应发合计</th><th>已发合计</th><th>应发减已发</th></tr></thead><tbody id="annualRows"></tbody></table></div>
<h3 style="font-size:16px">每月明细</h3><div class="scroll-table"><table><thead><tr><th>月份</th><th>员工</th><th>类型</th><th>应发</th><th>已发</th><th>差额</th><th>发放日期</th><th>操作</th></tr></thead><tbody id="recordRows"></tbody></table></div>
<p id="backupInfo" class="hint"></p><button id="backupBtn">下载完整备份（含修改历史）</button><button id="csvBtn">导出当前年份明细 CSV</button>
<label for="restoreFile">恢复／合并备份</label><input id="restoreFile" type="file" accept=".json,application/json"><button id="restoreBtn">检查并导入备份</button>
<p class="hint">恢复时只添加不存在的员工月份记录，已有记录保持不变。两台设备可以通过备份文件手动迁移；同一月份的不同版本需要核对后在明细里更新。</p>`;
document.querySelector('.wrap').append(ledger);
Object.keys(employees).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('ledgerEmployee').append(o);});
$('ledgerYear').value=today().slice(0,4);
function id(r){return `${r.employee}|${r.month}|${r.kind}`;}
function valid(r){return r&&Object.hasOwn(employees,r.employee)&&/^\d{4}-(0[1-9]|1[0-2])$/.test(r.month)&&['monthly','quarterly'].includes(r.kind)&&['due','paid','sales','receipts','leave','commission'].every(k=>Number.isFinite(r[k]))&&r.paid>=0&&r.sales>=0&&r.receipts>=0&&r.leave>=0&&r.leave<=30&&typeof r.note==='string'&&r.note.length<=500&&typeof r.paidDate==='string'&&(r.paidDate===''||/^\d{4}-\d{2}-\d{2}$/.test(r.paidDate))&&typeof r.updatedAt==='string'&&Number.isFinite(Date.parse(r.updatedAt));}
function read(){try{const raw=localStorage.getItem(key);if(!raw)return {version:1,records:[],history:[],lastBackup:''};const d=normalizeLedger(JSON.parse(raw));if(Array.isArray(d.records))d.records.forEach(r=>{r.employee=canonicalName(r.employee);});if(Array.isArray(d.history))d.history.forEach(r=>{r.employee=canonicalName(r.employee);});if(d.salesByMonth){for(const b of Object.values(d.salesByMonth)){for(const n of Object.keys(b)){const c=canonicalName(n);if(c!==n){b[c]=b[n];delete b[n];}}}}if(d.version!==1||!Array.isArray(d.records)||!Array.isArray(d.history)||!d.records.every(valid)||!d.history.every(valid)||new Set(d.records.map(id)).size!==d.records.length)throw Error();return d;}catch(e){blocked=true;throw Error('无法读取本地账本。为保护已有数据，已停止写入。请不要清理浏览器数据；可以先导出原始数据留存。');}}

const loadRecord=$('recordRows').onclick;$('recordRows').onclick=e=>{const k=e.target.dataset.record;if(k){try{const r=read().records.find(x=>id(x)===k);if(r?.kind==='monthly'&&sharedNames.includes(r.employee)){const b=r.receiptsBreakdown||read().receiptsByMonth?.[r.month]||{};staff.forEach((n,i)=>{$('staffReceipts'+i).value=b[n]??'';});}}catch(error){notice(error);}}loadRecord(e);if(k){$('huikuan').readOnly=sharedNames.includes(empSel.value);document.querySelector('label[for="huikuan"]').textContent=sharedNames.includes(empSel.value)?'当月全员实收金额合计（元，自动求和）':'当月回款/实收金额(元)';if(sharedNames.includes(empSel.value))showReceiptsTotal();}};
loadReceiptsMonth();receiptsMode();

const quick=document.createElement('section');quick.className='panel';quick.id='quickPayroll';quick.innerHTML=`<h2>导入一次，算好所有人工资</h2><label for="quickMonth">发哪个月的工资</label><input id="quickMonth" type="month"><label for="quickFile">导入营业额／工资表（Excel、CSV）</label><input id="quickFile" type="file" accept=".xlsx,.xls,.csv"><p class="hint">选择文件后自动计算并保存待发工资。表格有月份时会自动识别；请假天数未提供时按 0 天显示，请在工资单上核对。所有人的销售额、实收金额只计一次。</p><p id="quickStatus" role="status"></p><div id="quickReview" hidden><p id="quickSummary" class="stat"></p><div class="scroll-table"><table><thead><tr><th>员工</th><th>请假天数</th><th>应发工资（元）</th></tr></thead><tbody id="quickRows"></tbody></table></div><button id="quickExport">下载工资单</button><button id="quickSave">保存待发工资单</button><button id="quickPaid" class="primary">工资已发，全部归档</button><p class="hint">“全部归档”记录为已足额发放，并自动下载备份。部分发放请展开手动修正。页面不执行银行转账。</p></div>`;

const manual=document.createElement('details');manual.id='manualControls';manual.innerHTML='<summary>照片识别／手动修正／季度核算</summary>';
const wrap=document.querySelector('.wrap');const existing=[...wrap.children].filter(el=>el!==ledger&&el.tagName!=='H1'&&!el.classList.contains('sub'));existing.forEach(el=>manual.append(el));document.querySelector('.sub').after(quick);quick.after(manual);$('quickMonth').value=today().slice(0,7);document.querySelector('.sub').textContent='导入报表，核对工资，发完一键归档';
let quickData=null;
function quickCalculation(name){const emp=employees[name],rule=rules[emp.role],own=quickData.people[name],sales=(sharedNames.includes(name)||emp.role==='仓库')?quickData.totalSales:own.sales,receipts=sharedNames.includes(name)?quickData.totalReceipts:own.receipts,leave=own.leave;const commission=emp.role==='仓库'?sales*rule.monthRate:receipts*(sales>=emp.target?rule.met:(sales/emp.target)*rule.unmet);return {sales,receipts,leave,commission:round(commission),due:round(emp.base-471-emp.base/30*leave+(leave===0?100:0)+commission)};}
function renderQuick(){if(!quickData)return;let total=0;const rows=Object.keys(employees).map((n,i)=>{const r=quickCalculation(n);total+=r.due;return `<tr><td>${escapeHTML(n)}</td><td><input id="quickLeave${i}" type="number" min="0" max="30" step="0.5" value="${r.leave}" aria-label="${escapeHTML(n)}请假天数" style="width:100px;margin:0"></td><td id="quickDue${i}">${money(r.due)}</td></tr>`;});$('quickRows').innerHTML=rows.join('');$('quickSummary').textContent=quickData.month+' · 6 人应发合计 ¥'+money(total);$('quickReview').hidden=false;}
$('quickRows').oninput=e=>{const n=Object.keys(employees)[Number(e.target.id.replace('quickLeave',''))];if(!n)return;const v=Number(e.target.value);if(e.target.value===''||!Number.isFinite(v)||v<0||v>30){$('quickStatus').textContent='请假天数请填写 0 至 30。';return;}quickData.people[n].leave=v;let total=0;Object.keys(employees).forEach((name,i)=>{const r=quickCalculation(name);$('quickDue'+i).textContent=money(r.due);total+=r.due;});$('quickSummary').textContent=quickData.month+' · 6 人应发合计 ¥'+money(total);$('quickStatus').textContent='工资已按请假天数更新。';};
function selectQuickTable(book){const matches=[];for(const name of book.SheetNames){const ws=book.Sheets[name];if(book.Workbook?.Sheets?.[book.SheetNames.indexOf(name)]?.Hidden)continue;const range=ws['!ref']?XLSX.utils.decode_range(ws['!ref']):null;if(range&&(range.e.c>79||range.e.r>=10000))continue;const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true});for(let h=0;h<Math.min(50,rows.length);h++){const map={};for(const [k,re] of Object.entries(aliases)){let hit=rows[h].map((v,i)=>re.test(headerLabel(v))?i:-1).filter(i=>i>=0);if(k==='sales'){const net=hit.filter(i=>/^(销售净额|净销售额|销售净金额)$/.test(headerLabel(rows[h][i])));if(net.length)hit=net;}if(hit.length===1)map[k]=hit[0];}if(map.employee!==undefined&&map.sales!==undefined&&map.receipts!==undefined){matches.push({name,rows,h,map,salesLabel:cellText(rows[h][map.sales])});break;}}}if(matches.length!==1)throw Error(matches.length?'文件里有多张可用报表，请只保留本月需要的工作表，或展开手动修正选择工作表。':'没有找到员工、销售额、实收金额三列。请核对列名，或展开手动修正。');return matches[0];}
function parseQuick(book){const {name,rows,h,map,salesLabel}=selectQuickTable(book);const recognized=rows.slice(h+1).map(row=>({row,name:canonicalName(normal(row[map.employee]))})).filter(x=>x.name&&!/合计|总计|小计|操作员|编制单位|打印日期/.test(x.name)&&!(x.row[map.sales]===''&&x.row[map.receipts]===''));const dates=new Set(recognized.map(x=>map.month===undefined?'':monthValue(x.row[map.month])).filter(Boolean));let month=$('quickMonth').value;if(dates.size===1){month=[...dates][0];$('quickMonth').value=month;}else if(dates.size===0){const title=rows.slice(0,h).flat().map(cellText).join(' ');const from=title.match(/(?:起始日期|开始日期|统计日期|期间)[：:\s]*(20\d{2})[-/.](0?[1-9]|1[0-2])[-/.]\d{1,2}/);const to=title.match(/(?:终止日期|结束日期)[：:\s]*(20\d{2})[-/.](0?[1-9]|1[0-2])[-/.]\d{1,2}/);if(from){const inferred=from[1]+'-'+from[2].padStart(2,'0');if(to&&(to[1]+'-'+to[2].padStart(2,'0'))!==inferred)throw Error('报表跨多个月份，请导入单月报表。');month=inferred;$('quickMonth').value=month;}}if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))throw Error('请选择工资月份。');const people={},sales={},receipts={};for(const item of recognized){if(map.month!==undefined){const m=monthValue(item.row[map.month]);if(!m)throw Error(item.name+' 的月份无法识别，请核对表格。');if(m!==month)continue;}if(people[item.name])throw Error(item.name+' 有多行记录，可能包含重复汇总。请先每人保留一行，或展开手动修正。');const s=amountValue(item.row[map.sales]),r=amountValue(item.row[map.receipts]),l=map.leave===undefined||item.row[map.leave]===''?0:amountValue(item.row[map.leave]);if(s===''||r===''||l===''||l>30)throw Error(item.name+' 的金额或请假天数无效，请核对。');people[item.name]={sales:s,receipts:r,leave:l};sales[item.name]=s;receipts[item.name]=r;}const missing=Object.keys(employees).filter(n=>employees[n].role==='客服'&&!people[n]);if(missing.length)throw Error('缺少 '+missing.join('、')+' 的个人业绩，不能准确算出工资。');if(!recognized.length)throw Error('表格没有有效的个人业绩行。');const totalSales=round(Object.values(sales).reduce((a,v)=>a+v,0)),totalReceipts=round(Object.values(receipts).reduce((a,v)=>a+v,0));staff.forEach(n=>{if(!people[n])people[n]={sales:0,receipts:0,leave:0};sales[n]??=0;receipts[n]??=0;});return {month,people,sales,receipts,totalSales,totalReceipts,salesLabel,sheet:name};}
$('quickFile').onchange=async()=>{const f=$('quickFile').files[0];if(!f)return;quickData=null;$('quickReview').hidden=true;$('quickFile').disabled=true;$('quickStatus').textContent='正在读取并计算所有人工资…';try{if(f.size>15*1024*1024)throw Error('表格超过 15MB，请精简后导入。');await loadExcel();const buf=await f.arrayBuffer();let book;if(/\.csv$/i.test(f.name)){let text=new TextDecoder('utf-8').decode(buf);if(text.includes('\uFFFD'))text=new TextDecoder('gb18030').decode(buf);book=XLSX.read(text,{type:'string',raw:true,sheetRows:10001});}else book=XLSX.read(buf,{type:'array',cellDates:true,sheetRows:10001});quickData=parseQuick(book);renderQuick();saveQuick(false,true);}catch(e){$('quickStatus').textContent='尚未保存：'+e.message;}finally{$('quickFile').disabled=false;}};
$('quickMonth').onchange=()=>{if(quickData){quickData=null;$('quickReview').hidden=true;$('quickStatus').textContent='月份已更改，请重新选择文件，避免把其他月份的数据保存进来。';}};
function quickRecords(paid){if(!quickData)throw Error('请先导入表格。');for(let i=0;i<Object.keys(employees).length;i++){const el=$('quickLeave'+i);if(el.value===''||!Number.isFinite(Number(el.value))||Number(el.value)<0||Number(el.value)>30)throw Error('请先核对每个人的请假天数。');}const current=read();return Object.keys(employees).map(n=>{const calc=quickCalculation(n);if(calc.due<0)throw Error(n+' 应发工资为负数，请展开手动修正核对。');const old=current.records.find(r=>r.employee===n&&r.month===quickData.month&&r.kind==='monthly');return {...calc,employee:n,month:quickData.month,kind:'monthly',paid:paid?calc.due:(old?.paid||0),paidDate:paid?today():(old?.paidDate||''),note:old?.note||'',updatedAt:new Date().toISOString(),...(sharedNames.includes(n)?{salesBreakdown:quickData.sales,receiptsBreakdown:quickData.receipts}:{})};});}
function saveQuick(paid,automatic=false){try{const records=quickRecords(paid),d=read(),oldCount=records.filter(r=>d.records.some(x=>id(x)===id(r))).length;if(paid&&!confirm('确认这 6 位员工的本月工资都已足额发放？确认后会记为已发并下载备份。'))return;const changed=records.some(r=>{const old=d.records.find(x=>id(x)===id(r));return old&&['sales','receipts','leave','due','commission'].some(k=>old[k]!==r[k]);});if(!paid&&oldCount&&(!automatic||changed)&&!confirm('本月已有 '+oldCount+' 条工资记录。更新为本次导入的工资？已发金额保留，旧记录留在修改历史中。')){$('quickStatus').textContent='本月原记录已保留；当前工资仅为预览，尚未更新。';return;}for(const r of records){const i=d.records.findIndex(x=>id(x)===id(r));if(i>=0){d.history.push({...d.records[i]});d.records[i]=r;}else d.records.push(r);}d.salesByMonth??={};d.receiptsByMonth??={};d.salesByMonth[quickData.month]=quickData.sales;d.receiptsByMonth[quickData.month]=quickData.receipts;write(d);$('ledgerYear').value=quickData.month.slice(0,4);render();$('quickStatus').textContent=paid?'6 人工资已归档为足额发放，完整备份已开始下载。':'已自动保存 '+quickData.month+' 的 6 人工资。销售口径：'+quickData.salesLabel+'，合计 ¥'+money(quickData.totalSales)+'；全员实收 ¥'+money(quickData.totalReceipts)+'。请核对请假天数和金额；发完再点“工资已发，全部归档”。';if(paid)$('backupBtn').click();}catch(e){$('quickStatus').textContent=e.message;}}
$('quickSave').onclick=()=>saveQuick(false);$('quickPaid').onclick=()=>saveQuick(true);
$('quickExport').onclick=()=>{try{const records=quickRecords(false),rows=[['月份','员工','销售额','实收金额','请假天数','应发工资'],...records.map(r=>[r.month,r.employee,r.sales,r.receipts,r.leave,r.due])];download('\uFEFF'+rows.map(row=>row.join(',')).join('\r\n'),'工资单-'+quickData.month+'.csv','text/csv;charset=utf-8');}catch(e){$('quickStatus').textContent=e.message;}};

render();
